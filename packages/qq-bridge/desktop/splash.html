<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- 启动页是本地文件，不需要联网；CSP 收紧到"只能自己 + 内联样式" -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>InteractBot 正在启动</title>
    <style>
      /* 配色跟控制台一致（深色），这样"启动页 → 控制台"切换时不会闪一下白 */
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #0b0f19; color: #e6edf7;
        font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      main { width: min(620px, 88vw); text-align: center; }
      img { width: 96px; height: 96px; image-rendering: auto; }
      h1 { font-size: 20px; font-weight: 600; margin: 18px 0 6px; }
      #text { font-size: 15px; color: #cfe0ff; min-height: 1.6em; }
      #hint { font-size: 13px; color: #8fa3c0; min-height: 1.6em; margin-top: 4px; }
      .bar { height: 4px; background: #1b2436; border-radius: 2px; overflow: hidden; margin: 22px 0 8px; }
      .bar > i { display: block; height: 100%; width: 30%; background: #4f8cff; border-radius: 2px;
        animation: slide 1.4s ease-in-out infinite; }
      @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
      /* 停下来的时候不要假装还在动 —— 失败是失败，不是"还在加载" */
      .bar.stopped > i { animation: none; width: 100%; background: #b4443a; }
      .bar.done > i { animation: none; width: 100%; background: #3f9e5a; }
      .actions { margin-top: 26px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      button {
        font: inherit; padding: 8px 16px; border-radius: 8px; cursor: pointer;
        border: 1px solid #2c3a52; background: #16203a; color: #dce7f7;
      }
      button:hover { background: #1d2a48; }
      button.primary { background: #2b5fd9; border-color: #2b5fd9; color: #fff; }
      button.primary:hover { background: #3a6ef0; }
      footer { margin-top: 22px; font-size: 12px; color: #61728c; }
      code { background: #141c2e; padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img id="logo" alt="InteractBot" />
      <h1>InteractBot</h1>
      <div class="bar" id="bar"><i></i></div>
      <div id="text">正在启动…</div>
      <div id="hint"></div>

      <div class="actions">
        <button id="btn-start" class="primary" hidden>启动机器人</button>
        <button id="btn-retry" hidden>重试</button>
        <button id="btn-logs">看日志</button>
        <button id="btn-quit">退出</button>
      </div>

      <footer>
        关掉窗口<b>不会</b>让机器人下线（它会收到右下角托盘）。<br />
        日志：<code>logs\desktop.log</code>（桌面壳）与 <code>logs\bridge.log</code>（桥接）
      </footer>
    </main>

    <script>
      // ★ 图标用相对路径：打包后 assets/ 与 splash.html 同级（见 electron-builder.yml 的 files）。
      //   取不到就不显示，绝不因为一张图把启动页弄崩。
      const logo = document.getElementById('logo')
      logo.src = 'assets/app-icon.ico'
      logo.onerror = () => { logo.hidden = true }

      const text = document.getElementById('text')
      const hint = document.getElementById('hint')
      const bar = document.getElementById('bar')
      const btnStart = document.getElementById('btn-start')
      const btnRetry = document.getElementById('btn-retry')
      const btnLogs = document.getElementById('btn-logs')
      const btnQuit = document.getElementById('btn-quit')

      const api = window.interactbot
      const busy = (on) => { for (const b of [btnStart, btnRetry, btnLogs, btnQuit]) b.disabled = on }

      function render (p) {
        if (!p || typeof p !== 'object') return
        if (p.kind === 'failed') {
          bar.className = 'bar stopped'
          text.textContent = p.text || '启动失败'
          hint.textContent = ''
          btnStart.hidden = true; btnRetry.hidden = false
          busy(false)
          return
        }
        if (p.kind === 'started') {
          bar.className = 'bar'
          text.textContent = p.message || '已发起启动，正在等它就绪…'
          hint.textContent = ''
          btnStart.hidden = true; btnRetry.hidden = true
          return
        }
        if (p.phase === 'stopped') {
          bar.className = 'bar stopped'
          text.textContent = p.text || '机器人已停止'
          hint.textContent = ''
          btnStart.hidden = false; btnRetry.hidden = true
          busy(false)
          return
        }
        // phase / 进度：字与提示都由主进程给（那边的措辞是可测的纯函数）
        if (p.text) text.textContent = p.text
        if (typeof p.hint === 'string') hint.textContent = p.hint
        bar.className = 'bar'
        // 启动中不该能点"启动"（会撞上 process-guard 的"已经有一个在跑"）；
        // 但"探测/等待"阶段可以留一个「重试」，免得自动流程卡住时无事可做。
        if (p.phase === 'starting') { btnStart.hidden = true; btnRetry.hidden = true }
        else if (p.phase === 'probe') { btnStart.hidden = true; btnRetry.hidden = false }
      }

      if (api) {
        api.onProgress(render)
        const run = async (action) => {
          busy(true)
          const r = await api.act(action)
          busy(false)
          if (r && r.ok === false && r.message) { text.textContent = r.message; hint.textContent = '' }
        }
        btnStart.onclick = () => run('start')
        btnRetry.onclick = () => run('retry')
        btnLogs.onclick = () => api.act('logs')
        btnQuit.onclick = () => api.act('quit')
      } else {
        // 没有通道（理论上不该发生）：把话说明白，别让按钮点了没反应
        text.textContent = '启动页与主进程的通道没建起来'
        hint.textContent = '请把 logs\\desktop.log 发给开发者'
        for (const b of [btnStart, btnRetry, btnLogs, btnQuit]) b.disabled = true
      }
    </script>
  </body>
</html>
