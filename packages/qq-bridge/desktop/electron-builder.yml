# electron-builder 配置：把桌面壳打成**免安装目录版**（目标里只留 --dir，不出安装程序）。
#
# 为什么是"目录版"而不是"单文件 exe"：
#   · 与既有发布形态一致（`_release/InteractBot-<版本>-win-x64/` 整目录拷走就能用）；
#   · 不需要写注册表、不需要管理员权限；
#   · 单文件自解压版每次启动都要把 ~200MB 解到临时目录，首次启动明显更慢，
#     而且用户会以为"程序卡住了"。
#
# ⚠️ 三个刻意的取舍（都不是默认值）：
#   ① `asar: false` —— 壳的代码要能被使用者/后续维护者**直接读**（这个项目的立场是
#      "如实、可查"），而且 app 里只有 4 个小文件，打包收益接近零；
#   ② `electronDist` 指向本机已解好的运行时 —— 否则 electron-builder 会去
#      github.com 下（本机连不通，实测超时）。见 scripts/fetch-electron.mjs；
#   ③ `signAndEditExecutable` 保持默认（要它给 exe 换图标 + 写版本号），
#      它需要的 winCodeSign 走 npmmirror 镜像（见 assemble-desktop.mjs 的环境变量）。

appId: com.interactbot.bridge
productName: InteractBot
copyright: InteractBot

directories:
  # ⚠️ 这个值**会被 scripts/assemble-desktop.mjs 覆盖成绝对路径**（见那个脚本的注释：
  #    相对路径在"配置在 desktop/、projectDir 在 stage/"时会指到意料之外的地方）。
  #    这里留一个自洽的默认值，只为"这份配置单独拿出来看也说得通"。
  output: .build-desktop
  buildResources: .

# ★ 只打"壳"：不把 src/ / config-ui/ / vendor/ 卷进来 —— 它们是**包根**的东西，
#   由 scripts/assemble-release.mjs 平铺到发布包根目录，exe 从包根找它们。
#   （两边都塞一份 = 出现两个真相，改一处忘一处。）
files:
  - main.cjs
  - preload.cjs
  - lib.cjs
  - splash.html
  - assets/**
  - package.json
  - '!scripts/**'
  - '!.npm-cache/**'
  - '!install.log'
  - '!electron-builder.yml'

extraMetadata:
  name: interactbot-desktop

# ★★ 这一行必须在**顶层**，不能塞进 win: 里面。
#   实测教训：第一版把它写在 win: 下面（并只在注释里说明），electron-builder 直接忽略，
#   于是 app 被打成 `resources/app.asar` —— 而验收脚本去找 `resources/app/main.cjs`，
#   报"缺 5 个文件"。**而且构建本身是成功的**（exit 0、exe 也出来了），
#   只有验收能发现。这正是"配置写了但没生效"的典型：不报错，产物却是另一个形状。
#   为什么要 false：壳的代码要能被使用者/后续维护者**直接读**（这个项目的立场是"如实、可查"），
#   而 app 里只有 6 个小文件，打包成 asar 的收益接近零。
asar: false

win:
  target:
    - target: dir
      arch:
        - x64
  icon: assets/app-icon.ico
  # 本机没有代码签名证书：显式告诉 electron-builder 别去找（否则它会去翻证书库并失败）。
  # 这一步**必须留 true**（默认值也是 true）：给 exe 换图标 + 写"文件说明/产品名/版本号"
  # 就是这一步做的；它需要 winCodeSign（走镜像下，见 assemble-desktop.mjs 的环境变量）。
  signAndEditExecutable: true
  # ⚠️ 未签名的 exe 在 Windows 上会显示"未知发布者" —— 这是预期内的，不是缺陷。

# 让 electron-builder 直接用本机解好的 Electron 运行时（不下 github）
electronDist: node_modules/electron/dist
electronVersion: 38.8.6

npmRebuild: false
buildDependenciesFromSource: false
nodeGypRebuild: false
compression: normal
